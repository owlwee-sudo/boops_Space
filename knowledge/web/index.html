<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astronaut Health Relationship Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a left-to-right causal map (stressors → hubs → body → illness) with a monitoring column on the right; a side panel explains whatever you click. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#152033; --muted:#5a6678; --line:#d5dbe4; --accent:#2f5bd3;
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --c-stressor:#d4532b; --c-hub:#7448d4; --c-body:#b07c0c; --c-outcome:#c2366b; --c-signal:#0f8584; --c-counter:#2c8a45; --c-device:#3d6fb8;
  --e-causal:#6d7889; --e-confound:#cf3434;
  --v-good:#2c8a45; --v-caution:#c98a00; --v-weak:#cf3434; --v-early:#3d6fb8;
  --halo:#ffffff; --chip:#eef1f6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131b; --panel:#151c27; --ink:#e4e9f1; --muted:#95a1b3; --line:#283243; --accent:#7f9cf5;
    --c-stressor:#f07c55; --c-hub:#a789f2; --c-body:#e2b043; --c-outcome:#ef6c9a; --c-signal:#3cc2bd; --c-counter:#5fc477; --c-device:#73a2ea;
    --e-causal:#8794a8; --e-confound:#f26b6b;
    --v-good:#5fc477; --v-caution:#e7b23c; --v-weak:#f26b6b; --v-early:#73a2ea;
    --halo:#151c27; --chip:#1e2735;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131b; --panel:#151c27; --ink:#e4e9f1; --muted:#95a1b3; --line:#283243; --accent:#7f9cf5;
  --c-stressor:#f07c55; --c-hub:#a789f2; --c-body:#e2b043; --c-outcome:#ef6c9a; --c-signal:#3cc2bd; --c-counter:#5fc477; --c-device:#73a2ea;
  --e-causal:#8794a8; --e-confound:#f26b6b;
  --v-good:#5fc477; --v-caution:#e7b23c; --v-weak:#f26b6b; --v-early:#73a2ea;
  --halo:#151c27; --chip:#1e2735;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
header{padding:14px 20px 10px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.controls .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.tog{font:500 12.5px var(--font-body);color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tog .sw{width:14px;height:3px;border-radius:2px;background:currentColor}
.tog[data-layer][aria-pressed="false"]{opacity:.45;text-decoration:line-through}
#strong[aria-pressed="true"]{border-color:var(--c-body);background:color-mix(in srgb,var(--c-body) 18%,var(--panel))}
.tog:focus-visible,.btn:focus-visible,.tab:focus-visible,.link:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.graph-wrap{position:relative;overflow:auto;padding:8px 12px 12px}
svg#web{width:100%;min-width:900px;height:auto;display:block;user-select:none;touch-action:none}
.hint{position:absolute;left:20px;bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 9px;pointer-events:none}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 12px}
.tab{font:600 13px var(--font-body);color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:11px 10px 9px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:16px 18px 28px;flex:1}
.pane h2{font-size:18px;margin:0 0 4px;line-height:1.25;text-wrap:balance}
.pane h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;font-weight:600}
.pane p{margin:6px 0}
.lede{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:600 22px var(--font-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:3px 0}
.callout{border-left:3px solid var(--accent);background:var(--chip);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--font-body);padding:2px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.link{display:flex;width:100%;text-align:left;gap:8px;align-items:baseline;font:14px var(--font-body);color:var(--ink);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin:4px 0;cursor:pointer}
.link:hover{border-color:var(--accent)}
.link .arr{font-family:var(--font-mono);color:var(--muted);flex:none}
.link small{color:var(--muted);display:block;font-size:12.5px}
.stars{font-size:11px;letter-spacing:-1px;color:var(--c-body)}
.src{margin:8px 0;padding:0 0 8px;border-bottom:1px solid var(--line)}
.src:last-child{border-bottom:0}
.src a{color:var(--accent);text-decoration:none;font-weight:500}
.src a:hover{text-decoration:underline}
.src .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
.src.active{background:var(--chip);border-radius:8px;padding:6px 8px;border-bottom-color:transparent}
.btn{font:600 12.5px var(--font-body);color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.small{font-size:11.5px;padding:2px 8px}
.warn{color:var(--e-confound);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--accent);opacity:.75}
.reach{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:13px;margin:4px 0;cursor:pointer;background:none;border:0;color:var(--ink);width:100%;padding:2px 0;text-align:left;font-family:var(--font-body)}
.reach span:last-child{font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.legend-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;font-size:13px}
.legend-grid svg{display:block}
textarea.copybox{width:100%;height:120px;font:12px var(--font-mono);margin-top:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
#status{font-size:12px;color:var(--muted);margin-left:8px}

/* SVG */
.colhead{font:600 10.5px var(--font-body);letter-spacing:.12em;fill:var(--muted)}
.colrule{stroke:var(--line);stroke-width:1}
.node{cursor:pointer;outline:none}
.node rect{stroke-width:1.6;transition:opacity .15s}
.node text{font:500 12.5px var(--font-body);fill:var(--ink);pointer-events:none}
.cat-stressor rect{fill:color-mix(in srgb,var(--c-stressor) 16%,var(--panel));stroke:var(--c-stressor)}
.cat-hub rect{fill:color-mix(in srgb,var(--c-hub) 16%,var(--panel));stroke:var(--c-hub)}
.cat-body rect{fill:color-mix(in srgb,var(--c-body) 14%,var(--panel));stroke:var(--c-body)}
.cat-outcome rect{fill:color-mix(in srgb,var(--c-outcome) 14%,var(--panel));stroke:var(--c-outcome)}
.cat-signal rect{fill:var(--panel);stroke:var(--c-signal)}
.cat-counter rect{fill:color-mix(in srgb,var(--c-counter) 16%,var(--panel));stroke:var(--c-counter)}
.cat-device rect{fill:var(--panel);stroke:var(--c-device);stroke-dasharray:4 3}
.cat-stressor text,.cat-hub text{font-weight:600}
.node.sel rect{stroke-width:3}
.node.dim{opacity:.22}
.edge{fill:none;transition:opacity .15s}
.et-causal{stroke:var(--e-causal)}
.et-amplifies{stroke:var(--c-stressor);stroke-dasharray:8 4}
.et-protects{stroke:var(--c-counter)}
.et-measures{stroke:var(--c-signal);stroke-dasharray:2 3}
.et-confounds{stroke:var(--e-confound);stroke-dasharray:5 4}
.edge{opacity:.62}
.edge.dim{opacity:.07}
.edge.hl{opacity:1}
.edge.off,.hit.off{display:none}
.mk-causal{fill:var(--e-causal)} .mk-amplifies{fill:var(--c-stressor)} .mk-protects{fill:var(--c-counter)} .mk-measures{fill:var(--c-signal)} .mk-confounds{fill:var(--e-confound)}
.hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.elabel{font:500 11px var(--font-body);fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round;pointer-events:none}

@media (max-width: 900px){
  .layout{grid-template-columns:1fr;grid-template-rows:auto auto}
  aside{border-left:0;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  body{height:auto}
  html{height:auto}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header>
  <div>
    <h1>Astronaut Health Relationship Web</h1>
    <p class="sub">NASA Space Apps 2026 · health monitoring for astronauts · built from your research notes (13 Nov 2026)</p>
  </div>
  <div class="controls" role="group" aria-label="Show link types">
    <span class="lbl">Show:</span>
    <button class="tog" data-layer="causal" aria-pressed="true" style="color:var(--e-causal)"><span class="sw"></span><span style="color:var(--ink)">Causes</span></button>
    <button class="tog" data-layer="protects" aria-pressed="true" style="color:var(--c-counter)"><span class="sw"></span><span style="color:var(--ink)">Protects</span></button>
    <button class="tog" data-layer="measures" aria-pressed="true" style="color:var(--c-signal)"><span class="sw"></span><span style="color:var(--ink)">Measures</span></button>
    <button class="tog" data-layer="confounds" aria-pressed="true" style="color:var(--e-confound)"><span class="sw"></span><span style="color:var(--ink)">Confounds</span></button>
    <button class="tog" id="strong" aria-pressed="false" style="color:var(--c-body)"><span style="color:var(--ink)">Strongest evidence only ⭐⭐⭐</span></button>
  </div>
</header>

<main class="layout">
  <section class="graph-wrap" id="graphWrap">
    <svg id="web" viewBox="0 0 1240 760" role="img" aria-label="Relationship web: four spaceflight stressors act through cortisol, inflammation, fluid shift and unloading on immune, bone, muscle, heart, vessels and glucose, ending in latent virus reactivation and symptoms; a right-hand column lists the signals that can measure each node."></svg>
    <div class="hint">Hover to trace · click for details and sources · drag boxes to rearrange</div>
  </section>
  <aside>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-overview" aria-selected="true">Overview</button>
      <button class="tab" role="tab" id="tab-details" aria-selected="false">Details</button>
      <button class="tab" role="tab" id="tab-sources" aria-selected="false">Sources</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</main>

<script>

mk('line',{x1:990,y1:40,x2:990,y2:750,class:'colrule'},gCols);
const gE=mk('g',{},svg), gH=mk('g',{},svg), gN=mk('g',{},svg), gL=mk('g',{},svg);

EDGES.forEach(e=>{
  const w = e.type==='measures'?1.4 : e.type==='confounds'?1.5 : [1.2,1.3,2.2,3.2][e.stars||0];
  e.el=mk('path',{class:'edge et-'+e.type,'stroke-width':w,'marker-end':'url(#ar-'+e.type+')'},gE);
  e.hit=mk('path',{class:'hit'},gH);
  e.hit.addEventListener('pointerenter',()=>{state.hover={kind:'edge',id:e.i};render();});
  e.hit.addEventListener('pointerleave',()=>{state.hover=null;render();});
  e.hit.addEventListener('click',ev=>{ev.stopPropagation();select({kind:'edge',id:e.i});});
});
NODES.forEach(n=>{
  const g=mk('g',{class:'node cat-'+n.cat,tabindex:'0',role:'button','aria-label':n.label+' ('+CAT[n.cat].n+')'},gN);
  n.rect=mk('rect',{rx:14,ry:14},g);
  if(n.verdict){n.dot=mk('circle',{r:4.5,style:'fill:var('+VERDICT[n.verdict].c+')'},g);}
  n.text=mk('text',{'text-anchor':'middle',dy:'0.35em'},g);n.text.textContent=n.label;
  n.g=g; n.h=28;
  g.addEventListener('pointerenter',()=>{if(!drag){state.hover={kind:'node',id:n.id};render();}});
  g.addEventListener('pointerleave',()=>{if(!drag){state.hover=null;render();}});
  g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select({kind:'node',id:n.id});}});
  g.addEventListener('pointerdown',ev=>startDrag(ev,n));
});
bg.addEventListener('click',()=>{state.sel=null;render();showTab('overview');});

function measure(){
  NODES.forEach(n=>{
    const tw=n.text.getComputedTextLength();
    const pad=n.verdict?36:24; n.w=Math.ceil(tw+pad);
    n.rect.setAttribute('x',-n.w/2);n.rect.setAttribute('y',-n.h/2);n.rect.setAttribute('width',n.w);n.rect.setAttribute('height',n.h);
    if(n.verdict){n.dot.setAttribute('cx',-n.w/2+13);n.dot.setAttribute('cy',0);n.text.setAttribute('x',6);}
  });
  place();
}
function place(){NODES.forEach(n=>n.g.setAttribute('transform','translate('+n.x+','+n.y+')'));EDGES.forEach(geom);render();}
function clip(n,px,py){
  const dx=px-n.x, dy=py-n.y, hw=n.w/2+3, hh=n.h/2+3;
  const t=Math.min(hw/Math.max(Math.abs(dx),1e-6), hh/Math.max(Math.abs(dy),1e-6));
  return t>=1?[px,py]:[n.x+dx*t,n.y+dy*t];
}
function geom(e){
  const a=byId[e.s], b=byId[e.t];
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
  const k=(e.bend!==undefined?e.bend:0.1);
  const cx=(a.x+b.x)/2-dy/len*len*k, cy=(a.y+b.y)/2+dx/len*len*k;
  const p0=clip(a,cx,cy), p1=clip(b,cx,cy);
  e.mid=[.25*p0[0]+.5*cx+.25*p1[0], .25*p0[1]+.5*cy+.25*p1[1]];
  const d='M'+p0[0].toFixed(1)+','+p0[1].toFixed(1)+' Q'+cx.toFixed(1)+','+cy.toFixed(1)+' '+p1[0].toFixed(1)+','+p1[1].toFixed(1);
  e.el.setAttribute('d',d); e.hit.setAttribute('d',d);
}

/* drag */
let drag=null;
function svgPt(ev){const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function startDrag(ev,n){
  ev.stopPropagation();
  const p=svgPt(ev); drag={n,ox:p.x-n.x,oy:p.y-n.y,sx:ev.clientX,sy:ev.clientY,moved:false};
  n.g.setPointerCapture(ev.pointerId);
  const move=e=>{
    if(!drag)return;
    if(!drag.moved && Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4) return;
    drag.moved=true; const q=svgPt(e);
    n.x=Math.max(n.w/2,Math.min(1240-n.w/2,q.x-drag.ox)); n.y=Math.max(40,Math.min(748,q.y-drag.oy));
    n.g.setAttribute('transform','translate('+n.x+','+n.y+')');
    EDGES.forEach(ed=>{if(ed.s===n.id||ed.t===n.id)geom(ed);}); render();
  };
  const up=()=>{
    n.g.removeEventListener('pointermove',move); n.g.removeEventListener('pointerup',up); n.g.removeEventListener('pointercancel',up);
    const wasDrag=drag&&drag.moved; drag=null;
    if(!wasDrag) select({kind:'node',id:n.id});
  };
  n.g.addEventListener('pointermove',move); n.g.addEventListener('pointerup',up); n.g.addEventListener('pointercancel',up);
}

function focusSet(){
  const f=state.hover||state.sel; if(!f) return null;
  const N=new Set(), E=new Set();
  if(f.kind==='node'){N.add(f.id);EDGES.forEach(e=>{if(visible(e)&&(e.s===f.id||e.t===f.id)){E.add(e.i);N.add(e.s);N.add(e.t);}});}
  else if(f.kind==='edge'){const e=EDGES[f.id];E.add(e.i);N.add(e.s);N.add(e.t);}
  else if(f.kind==='source'){NODES.forEach(n=>{if(n.src.includes(f.id))N.add(n.id);});EDGES.forEach(e=>{if(e.src.includes(f.id)){E.add(e.i);N.add(e.s);N.add(e.t);}});}
  return {N,E};
}
function render(){
  const fs=focusSet();
  EDGES.forEach(e=>{
    const v=visible(e);
    e.el.classList.toggle('off',!v); e.hit.classList.toggle('off',!v);
    e.el.classList.toggle('dim',!!fs&&!fs.E.has(e.i)); e.el.classList.toggle('hl',!!fs&&fs.E.has(e.i));
  });
  NODES.forEach(n=>{
    n.g.classList.toggle('dim',!!fs&&!fs.N.has(n.id));
    n.g.classList.toggle('sel',!!state.sel&&state.sel.kind==='node'&&state.sel.id===n.id);
  });
  gL.textContent='';
  if(fs){fs.E.forEach(i=>{const e=EDGES[i];if(!visible(e))return;const t=mk('text',{x:e.mid[0].toFixed(1),y:(e.mid[1]-5).toFixed(1),'text-anchor':'middle',class:'elabel'},gL);t.textContent=e.label;});}
}

/* ---------------- PANEL ---------------- */
const pane=document.getElementById('pane');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars=n=>n?'<span class="stars" aria-label="'+n+' of 3 stars">'+'⭐'.repeat(n)+'</span>':'';
const evi=ev=>ev?ev.split('').map(c=>EVI[c]).join(' · '):'';
function catChip(n){return '<span class="chip"><span class="dot" style="background:var('+CAT[n.cat].c+')"></span>'+CAT[n.cat].n+'</span>';}
function typeChip(t){return '<span class="chip"><span class="dot" style="background:var('+ETYPE[t].c+')"></span>'+ETYPE[t].t+'</span>';}
function srcList(ids){
  if(!ids.length) return '<p class="lede">No source attached in your notes yet.</p>';
  return ids.map(id=>{const s=srcById[id];return '<div class="src"><a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t)+'</a><div class="meta"><span>'+esc(s.g)+'</span></div></div>';}).join('');
}
function edgeBtn(e,dir){
  const other=dir==='out'?byId[e.t]:byId[e.s];
  return '<button class="link" data-edge="'+e.i+'"><span class="arr">'+(dir==='out'?'→':'←')+'</span><span>'+esc(other.label)+' '+stars(e.stars)+'<small>'+esc(e.label)+'</small></span></button>';
}
function nodeDetails(n){
  const out=EDGES.filter(e=>e.s===n.id), inc=EDGES.filter(e=>e.t===n.id);
  const groups=[
    ['Leads to',out.filter(e=>e.type==='causal'||e.type==='amplifies'),'out'],
    ['Comes from',inc.filter(e=>e.type==='causal'||e.type==='amplifies'),'in'],
    ['Protects',out.filter(e=>e.type==='protects'),'out'],
    ['Protected by',inc.filter(e=>e.type==='protects'),'in'],
    ['Measured by',inc.filter(e=>e.type==='measures'),'in'],
    ['Measures',out.filter(e=>e.type==='measures'),'out'],
    ['Confounds',out.filter(e=>e.type==='confounds'),'out'],
    ['Confounded by',inc.filter(e=>e.type==='confounds'),'in']
  ];
  const allSrc=[...new Set([...n.src,...out.flatMap(e=>e.src),...inc.flatMap(e=>e.src)])];
  let h='<div class="row">'+catChip(n)+(n.verdict?'<span class="chip"><span class="dot" style="background:var('+VERDICT[n.verdict].c+')"></span>'+VERDICT[n.verdict].t+'</span>':'')+'</div>';
  h+='<h2 style="margin-top:8px">'+esc(n.label)+'</h2><p>'+esc(n.desc)+'</p>';
  if(n.varies) h+='<p class="lede"><b>Varies day to day?</b> '+esc(n.varies)+'</p>';
  const r=reach(n.id); if(r.size && n.cat!=='signal' && n.cat!=='device') h+='<p class="lede"><b>Downstream reach:</b> '+r.size+' nodes through cause links.</p>';
  groups.forEach(([t,list,dir])=>{if(list.length) h+='<h3>'+t+' ('+list.length+')</h3>'+list.map(e=>edgeBtn(e,dir)).join('');});
  if(n.cat==='signal'&&!inc.some(e=>e.type==='measures')&&false){}
  h+='<h3>Sources ('+allSrc.length+')</h3>'+srcList(allSrc);
  return h;
}
function edgeDetails(e){
  const a=byId[e.s], b=byId[e.t];
  let h='<div class="row">'+typeChip(e.type)+(e.sec?'<span class="chip">Notes §'+esc(e.sec)+'</span>':'')+'</div>';
  h+='<h2 style="margin-top:8px">'+esc(a.label)+' → '+esc(b.label)+'</h2>';
  h+='<p><b>'+esc(e.label)+'</b></p>';
  if(e.ev||e.stars) h+='<p class="lede">Evidence: '+evi(e.ev)+' '+stars(e.stars)+'</p>';
  if(e.note) h+='<p>'+esc(e.note)+'</p>';
  h+='<div class="row" style="margin-top:8px"><button class="btn" data-node="'+a.id+'">Open '+esc(a.label)+'</button><button class="btn" data-node="'+b.id+'">Open '+esc(b.label)+'</button></div>';
  h+='<h3>Sources ('+e.src.length+')</h3>'+srcList(e.src);
  if(!e.src.length && (e.type==='causal')) h+='<p class="warn">Add a citation for this link before submitting.</p>';
  return h;
}
function reach(id){
  const seen=new Set(), stack=[id];
  while(stack.length){const c=stack.pop();EDGES.forEach(e=>{if(e.s===c&&(e.type==='causal'||e.type==='amplifies')&&!seen.has(e.t)&&e.t!==id){seen.add(e.t);stack.push(e.t);}});}
  return seen;
}
function overview(){
  const causal=EDGES.filter(e=>e.type==='causal'||e.type==='amplifies').length;
  const ranks=NODES.filter(n=>['stressor','hub'].includes(n.cat)).map(n=>({n,r:reach(n.id).size})).sort((x,y)=>y.r-x.r);
  const max=ranks[0].r;
  let h='<h2>How the pieces connect</h2><p class="lede">Four stressors reach the body through a few shared hubs. The right column shows what you can actually measure. Click any box or line for the evidence behind it.</p>';
  h+='<div class="stats"><div class="stat"><b>'+NODES.length+'</b><span>concepts</span></div><div class="stat"><b>'+EDGES.length+'</b><span>links ('+causal+' causal)</span></div><div class="stat"><b>'+SOURCES.length+'</b><span>sources</span></div></div>';
  h+='<h3>Downstream reach</h3><p class="lede" style="font-size:13px">How many nodes each factor can affect through cause links.</p>';
  ranks.forEach(({n,r})=>{h+='<button class="reach" data-node="'+n.id+'"><span>'+esc(n.label.replace(' / HPA axis','').replace(' / oxidative stress',''))+'</span><span class="bar" style="width:'+(r/max*100).toFixed(0)+'%;background:var('+CAT[n.cat].c+')"></span><span>'+r+'</span></button>';});
  h+='<div class="callout"><b>Most connected ≠ most useful to monitor.</b> Microgravity is the biggest cause but never changes. Stress, radiation dose, exercise/loading and sleep vary, so they are the signals worth tracking, each against the astronaut’s own in-flight baseline.</div>';
  h+='<h3>What the map shows</h3><ul class="plain">'+
     '<li>Most arrows pass through two hubs: <b>cortisol</b> and <b>inflammation / oxidative stress</b> (IL-6, RANKL, TNF-α).</li>'+
     '<li>Two separate routes weaken T cells: cortisol, and microgravity acting directly on the cells.</li>'+
     '<li>Unloading shrinks muscle, bone and heart together; exercise is the one countermeasure for all three.</li>'+
     '<li>Fluid shift confounds five measures (red dashed lines), so baselines must be set in flight.</li>'+
     '<li>Vessel damage is a deep-space risk; in low Earth orbit arteries held up.</li></ul>';
  h+='<h3>Legend</h3><div class="legend-grid">';
  Object.entries(ETYPE).forEach(([k,v])=>{const dash={causal:'',amplifies:'8 4',protects:'',measures:'2 3',confounds:'5 4'}[k];
    h+='<svg width="44" height="10" aria-hidden="true"><line x1="2" y1="5" x2="42" y2="5" style="stroke:var('+v.c+')" stroke-width="2.4" stroke-dasharray="'+dash+'"/></svg><span>'+v.t+'</span>';});
  Object.entries(CAT).forEach(([k,v])=>{h+='<svg width="44" height="16" aria-hidden="true"><rect x="4" y="2" width="36" height="12" rx="6" style="fill:var(--panel);stroke:var('+v.c+')" stroke-width="1.6"/></svg><span>'+v.n+'</span>';});
  Object.values(VERDICT).forEach(v=>{h+='<svg width="44" height="10" aria-hidden="true"><circle cx="22" cy="5" r="4.5" style="fill:var('+v.c+')"/></svg><span>Signal: '+v.t+'</span>';});
  h+='</div><p class="lede" style="margin-top:10px;font-size:13px">Line thickness = evidence strength (⭐ to ⭐⭐⭐). Evidence type: 🧑 humans · 🐭 animals · 🧫 cells.</p>';
  return h;
}
function sourcesPane(){
  const uses={}; SOURCES.forEach(s=>uses[s.id]={n:[],e:[]});
  NODES.forEach(n=>n.src.forEach(id=>uses[id].n.push(n)));
  EDGES.forEach(e=>e.src.forEach(id=>uses[id].e.push(e)));
  const unlinked=SOURCES.filter(s=>!uses[s.id].n.length&&!uses[s.id].e.length);
  const noSrc=EDGES.filter(e=>e.type==='causal'&&!e.src.length);
  let h='<h2>Sources</h2><p class="lede">Click <b>Show links</b> to see which parts of the web a source supports.</p>';
  h+='<div class="row" style="margin:10px 0"><button class="btn" id="copyRefs">Copy reference list</button><span id="status" role="status"></span></div>';
  if(noSrc.length) h+='<p class="warn" style="font-size:13px">Causal links with no citation: '+noSrc.map(e=>esc(byId[e.s].label+' → '+byId[e.t].label)).join('; ')+'.</p>';
  if(unlinked.length) h+='<p class="warn" style="font-size:13px">Not linked to the web yet: '+unlinked.map(s=>esc(s.t)).join('; ')+'.</p>';
  const groups=[...new Set(SOURCES.map(s=>s.g))];
  groups.forEach(g=>{
    h+='<h3>'+esc(g)+'</h3>';
    SOURCES.filter(s=>s.g===g).forEach(s=>{
      const u=uses[s.id], cnt=u.n.length+u.e.length;
      const supports=[...u.e.map(e=>byId[e.s].label+' → '+byId[e.t].label),...u.n.map(n=>n.label)];
      const active=state.sel&&state.sel.kind==='source'&&state.sel.id===s.id;
      h+='<div class="src'+(active?' active':'')+'"><a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>'+
         '<div class="meta"><button class="btn small" data-src="'+s.id+'" aria-pressed="'+active+'">'+(active?'Showing':'Show links')+' ('+cnt+')</button>'+
         '<span>'+esc(supports.slice(0,3).join(' · '))+(supports.length>3?' · +'+(supports.length-3)+' more':'')+'</span></div></div>';
    });
  });
  h+='<p class="lede" style="font-size:12.5px;margin-top:14px">Space Apps rule: every resource used must be cited, open-source tools included.</p>';
  return h;
}
function showTab(t){
  state.tab=t;
  ['overview','details','sources'].forEach(x=>document.getElementById('tab-'+x).setAttribute('aria-selected',x===t));
  if(t==='overview') pane.innerHTML=overview();
  else if(t==='sources') pane.innerHTML=sourcesPane();
  else{
    const s=state.sel;
    if(s&&s.kind==='node') pane.innerHTML=nodeDetails(byId[s.id]);
    else if(s&&s.kind==='edge') pane.innerHTML=edgeDetails(EDGES[s.id]);
    else pane.innerHTML='<h2>Nothing selected</h2><p class="lede">Click a box or a line in the web to see what it does, how strong the evidence is and which papers back it.</p>';
  }
  pane.scrollTop=0;
}
function select(s){
  state.sel=s; render();
  if(s.kind==='source') showTab('sources'); else showTab('details');
}
pane.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-edge],[data-node],[data-src],#copyRefs'); if(!b) return;
  if(b.id==='copyRefs'){copyRefs();return;}
  if(b.dataset.edge!==undefined) select({kind:'edge',id:+b.dataset.edge});
  else if(b.dataset.node) select({kind:'node',id:b.dataset.node});
  else if(b.dataset.src){ if(state.sel&&state.sel.kind==='source'&&state.sel.id===b.dataset.src){state.sel=null;render();showTab('sources');} else select({kind:'source',id:b.dataset.src}); }
});
pane.addEventListener('mouseover',ev=>{const b=ev.target.closest('[data-edge],[data-node]');if(!b)return;state.hover=b.dataset.edge!==undefined?{kind:'edge',id:+b.dataset.edge}:{kind:'node',id:b.dataset.node};render();});
pane.addEventListener('mouseout',ev=>{if(ev.target.closest('[data-edge],[data-node]')){state.hover=null;render();}});
['overview','details','sources'].forEach(t=>document.getElementById('tab-'+t).addEventListener('click',()=>showTab(t)));

function copyRefs(){
  const groups=[...new Set(SOURCES.map(s=>s.g))];
  const txt=groups.map(g=>'## '+g+'\n'+SOURCES.filter(s=>s.g===g).map(s=>'- '+s.t+' — '+s.u).join('\n')).join('\n\n');
  const st=document.getElementById('status');
  const fallback=()=>{st.textContent='Copy blocked here: select the text below.';const ta=document.createElement('textarea');ta.className='copybox';ta.readOnly=true;ta.value=txt;st.parentNode.after(ta);ta.focus();ta.select();};
  try{navigator.clipboard.writeText(txt).then(()=>{st.textContent='Copied '+SOURCES.length+' references';},fallback);}catch(e){fallback();}
}

/* toggles */
document.querySelectorAll('.tog[data-layer]').forEach(b=>b.addEventListener('click',()=>{
  const l=b.dataset.layer; state.layers[l]=!state.layers[l]; b.setAttribute('aria-pressed',state.layers[l]); render();
}));
document.getElementById('strong').addEventListener('click',e=>{
  state.strong=!state.strong; e.currentTarget.setAttribute('aria-pressed',state.strong); render();
});

measure();
showTab('overview');
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(measure);
</script>
</body>
